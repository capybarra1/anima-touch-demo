<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11141b">
  <title>Anima 触摸演示</title>
  <link rel="stylesheet" href="styles.css?v=4">
  <script src="player.js?v=4" defer></script>
</head>
<body>
  <main class="demo">
    <header class="toolbar">
      <h1>Anima <span>触摸演示</span></h1>
      <div class="modes" role="group" aria-label="反馈时机">
        <button type="button" data-mode="immediate" aria-pressed="true">立即反馈</button>
        <button type="button" data-mode="after-loop" aria-pressed="false">播完本轮再反馈</button>
      </div>
      <button class="presentation-button" id="presentation" type="button" aria-pressed="false">进入演示</button>
    </header>

    <div class="screen-slot">
    <section class="stage" aria-label="猫咪触摸演示" data-clip="idle" data-phase="loading">
      <div class="artboard">
      <div class="media" aria-hidden="true">
        <video id="idle" src="media/idle.mp4" poster="media/idle.jpg" muted playsinline preload="auto" loop disablepictureinpicture></video>
        <video id="feedback" src="media/feedback.mp4" muted playsinline preload="auto" disablepictureinpicture></video>
      </div>
      <img class="figma-ui clock-date" src="assets/clock-date.svg" width="936" height="488" alt="22:01，5月8日 星期四">
      <img class="figma-ui music-controls" src="assets/music-controls.svg" width="936" height="296" alt="蓝牙、播放、下一首和星光图标">
      <img class="figma-ui top-bar" src="assets/status-bar.svg" width="2560" height="112" alt="状态栏">
      <img class="figma-ui dock" src="assets/dock.svg" width="2560" height="184" alt="底部快捷栏，22.5度">
      </div>
      <button type="button" class="cat" aria-label="摸一下猫咪" aria-disabled="true"></button>
      <button type="button" class="resume" hidden>点一下开始播放</button>
    </section>
    </div>

    <p class="status" role="status"><span class="status-dot" aria-hidden="true"></span><span id="status">正在加载视频…</span></p>
  </main>
</body>
</html>
